<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feOffset dx="0" dy="4" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offset" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Header Banner -->
  <g transform="translate(40, 25)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="-0.5">GEV-VERIFY (SATYAM)</text>
    <text x="260" y="24" fill="#94a3b8" font-size="14" font-weight="500">|     — System Architecture &amp; Evidence Pipeline</text>
    <rect x="910" y="4" width="250" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="925" cy="17" r="4" fill="#10b981" />
    <text x="936" y="21" fill="#cbd5e1" font-size="11" font-weight="600">Statutory Compliant: GFR 2017</text>
  </g>

  <!-- Legal / Governance Callout Banner -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="1120" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="20" y="22" fill="#a5b4fc" font-size="12" font-weight="700">GOVERNANCE MANDATE:</text>
    <text x="180" y="22" fill="#e0e7ff" font-size="12" font-weight="500">AI is strictly Decision-Support &amp; Advisory. The AI never autonomously qualifies/disqualifies bidders. The Procurement Officer retains 100% final statutory authority.</text>
  </g>

  <!-- LAYER 1: USER LAYER -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="1120" height="65" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="160" height="65" rx="10" fill="#0f172a" />
    <text x="25" y="38" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="1">1. USER LAYER</text>
    
    <g transform="translate(185, 12)">
      <rect x="0" y="0" width="280" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="16" y="26" fill="#f1f5f9" font-size="12" font-weight="700">Tender Inviting Authority (TIA)</text>
    </g>
    <g transform="translate(485, 12)">
      <rect x="0" y="0" width="280" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="16" y="26" fill="#f1f5f9" font-size="12" font-weight="700">Senior Procurement Officer</text>
    </g>
    <g transform="translate(785, 12)">
      <rect x="0" y="0" width="310" height="42" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="16" y="26" fill="#94a3b8" font-size="12" font-weight="600">CAG Auditor / Oversight Reviewer</text>
    </g>
  </g>

  <!-- Connect 1 to 2 -->
  <line x1="600" y1="185" x2="600" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- LAYER 2: PRESENTATION LAYER -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="1120" height="75" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="160" height="75" rx="10" fill="#0f172a" />
    <text x="18" y="43" fill="#60a5fa" font-size="12" font-weight="800" letter-spacing="1">2. PRESENTATION</text>

    <!-- Component Cards -->
    <g transform="translate(180, 14)">
      <rect x="0" y="0" width="215" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="700">Executive Dashboard</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">Portfolio metrics, SLA, alerts</text>
    </g>
    <g transform="translate(410, 14)">
      <rect x="0" y="0" width="220" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="700">Bidder Dossier View</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">Tri-layer side-by-side inspector</text>
    </g>
    <g transform="translate(645, 14)">
      <rect x="0" y="0" width="225" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="700">3-Way Reconciliation Tab</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">Document vs Portal vs Tender</text>
    </g>
    <g transform="translate(885, 14)">
      <rect x="0" y="0" width="215" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="700">Audit Trail &amp; Reports</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">Evaluation runs &amp; PDF export</text>
    </g>
  </g>

  <!-- Connect 2 to 3 -->
  <line x1="600" y1="280" x2="600" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- LAYER 3: APPLICATION & API GATEWAY -->
  <g transform="translate(40, 300)">
    <rect x="0" y="0" width="1120" height="65" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="160" height="65" rx="10" fill="#0f172a" />
    <text x="20" y="38" fill="#34d399" font-size="12" font-weight="800" letter-spacing="1">3. APPLICATION</text>

    <g transform="translate(180, 11)">
      <rect x="0" y="0" width="920" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="20" y="26" fill="#ecfdf5" font-size="12" font-weight="700">Node.js + Express REST API Gateway (/api)</text>
      <text x="440" y="26" fill="#a7f3d0" font-size="11">JWT RBAC Auth • Request Tracing • Validation Schemas (Zod) • OpenAPI 3.0</text>
    </g>
  </g>

  <!-- Connect 3 to 4 & 5 split -->
  <line x1="380" y1="365" x2="380" y2="385" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="820" y1="365" x2="820" y2="385" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- LAYER 4 & 5: DUAL COLUMN (INTELLIGENCE & VERIFICATION) -->
  <g transform="translate(40, 385)">
    <!-- LEFT COLUMN: INTELLIGENCE LAYER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="545" height="180" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="545" height="32" rx="10" fill="#2e1065" />
      <text x="18" y="21" fill="#c4b5fd" font-size="12" font-weight="800" letter-spacing="0.5">4. DOCUMENT &amp; CLAUSE INTELLIGENCE</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="245" height="55" rx="6" fill="#1e293b" stroke="#6d28d9" stroke-width="1" />
        <text x="12" y="22" fill="#ede9fe" font-size="11" font-weight="700">Multimodal Field Extraction</text>
        <text x="12" y="38" fill="#a78bfa" font-size="10">GSTIN, PAN, UDIN, Local Content %, OEM</text>
      </g>
      <g transform="translate(285, 45)">
        <rect x="0" y="0" width="245" height="55" rx="6" fill="#1e293b" stroke="#6d28d9" stroke-width="1" />
        <text x="12" y="22" fill="#ede9fe" font-size="11" font-weight="700">RFP Clause Intelligence</text>
        <text x="12" y="38" fill="#a78bfa" font-size="10">Auto-derives draft tender requirements</text>
      </g>
      <g transform="translate(15, 110)">
        <rect x="0" y="0" width="245" height="55" rx="6" fill="#1e293b" stroke="#6d28d9" stroke-width="1" />
        <text x="12" y="22" fill="#ede9fe" font-size="11" font-weight="700">Evidence Citation Engine</text>
        <text x="12" y="38" fill="#a78bfa" font-size="10">Page numbers &amp; verbatim text quotes</text>
      </g>
      <g transform="translate(285, 110)">
        <rect x="0" y="0" width="245" height="55" rx="6" fill="#1e293b" stroke="#6d28d9" stroke-width="1" />
        <text x="12" y="22" fill="#ede9fe" font-size="11" font-weight="700">Zero-Hallucination Policy</text>
        <text x="12" y="38" fill="#a78bfa" font-size="10">Strict null checks &amp; missing field audit</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: MULTI-SOURCE VERIFICATION -->
    <g transform="translate(575, 0)">
      <rect x="0" y="0" width="545" height="180" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="545" height="32" rx="10" fill="#451a03" />
      <text x="18" y="21" fill="#fde68a" font-size="12" font-weight="800" letter-spacing="0.5">5. MULTI-SOURCE VERIFICATION ADAPTERS</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="160" height="55" rx="6" fill="#1e293b" stroke="#78350f" stroke-width="1" />
        <text x="10" y="22" fill="#fef3c7" font-size="11" font-weight="700">CBIC / GSTN</text>
        <text x="10" y="38" fill="#d97706" font-size="10">Active GSTIN status</text>
      </g>
      <g transform="translate(190, 45)">
        <rect x="0" y="0" width="160" height="55" rx="6" fill="#1e293b" stroke="#78350f" stroke-width="1" />
        <text x="10" y="22" fill="#fef3c7" font-size="11" font-weight="700">Income Tax (CBDT)</text>
        <text x="10" y="38" fill="#d97706" font-size="10">PAN &amp; CA UDIN registry</text>
      </g>
      <g transform="translate(365, 45)">
        <rect x="0" y="0" width="165" height="55" rx="6" fill="#1e293b" stroke="#78350f" stroke-width="1" />
        <text x="10" y="22" fill="#fef3c7" font-size="11" font-weight="700">MSME Udyam</text>
        <text x="10" y="38" fill="#d97706" font-size="10">Enterprise tier &amp; validity</text>
      </g>
      <g transform="translate(15, 110)">
        <rect x="0" y="0" width="160" height="55" rx="6" fill="#1e293b" stroke="#78350f" stroke-width="1" />
        <text x="10" y="22" fill="#fef3c7" font-size="11" font-weight="700">EPFO / ESIC</text>
        <text x="10" y="38" fill="#d97706" font-size="10">Active workforce payroll</text>
      </g>
      <g transform="translate(190, 110)">
        <rect x="0" y="0" width="160" height="55" rx="6" fill="#1e293b" stroke="#78350f" stroke-width="1" />
        <text x="10" y="22" fill="#fef3c7" font-size="11" font-weight="700">OEM &amp; DPIIT</text>
        <text x="10" y="38" fill="#d97706" font-size="10">Auth codes &amp; startups</text>
      </g>
      <g transform="translate(365, 110)">
        <rect x="0" y="0" width="165" height="55" rx="6" fill="#1e293b" stroke="#78350f" stroke-width="1" />
        <text x="10" y="22" fill="#fef3c7" font-size="11" font-weight="700">Debarment Repository</text>
        <text x="10" y="38" fill="#d97706" font-size="10">GeM / CPPP Blacklists</text>
      </g>
    </g>
  </g>

  <!-- Connect Columns to Reconciliation -->
  <path d="M 312 565 L 312 585 L 600 585 L 600 600" fill="none" stroke="#64748b" stroke-width="1.5" />
  <path d="M 847 565 L 847 585 L 600 585 L 600 600" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-active)" />

  <!-- LAYER 6: DECISION & THREE-WAY RECONCILIATION ENGINE -->
  <g transform="translate(40, 600)">
    <rect x="0" y="0" width="1120" height="85" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="160" height="85" rx="10" fill="#064e3b" />
    <text x="16" y="38" fill="#a7f3d0" font-size="11" font-weight="800" letter-spacing="0.5">6. DETERMINISTIC</text>
    <text x="16" y="55" fill="#6ee7b7" font-size="11" font-weight="800" letter-spacing="0.5">RECONCILIATION</text>

    <!-- Reconciliation Flow -->
    <g transform="translate(180, 15)">
      <rect x="0" y="0" width="220" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" fill="#ecfdf5" font-size="11" font-weight="700">Three-Way Reconciliation</text>
      <text x="12" y="38" fill="#6ee7b7" font-size="10">Doc vs Portal vs Requirement</text>
    </g>
    <text x="415" y="47" fill="#10b981" font-size="18" font-weight="900">→</text>
    <g transform="translate(440, 15)">
      <rect x="0" y="0" width="200" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" fill="#ecfdf5" font-size="11" font-weight="700">Deterministic Scorer</text>
      <text x="12" y="38" fill="#6ee7b7" font-size="10">Weighted 0–100 scale (Rules)</text>
    </g>
    <text x="655" y="47" fill="#10b981" font-size="18" font-weight="900">→</text>
    <g transform="translate(680, 15)">
      <rect x="0" y="0" width="200" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" fill="#ecfdf5" font-size="11" font-weight="700">Risk Assessment</text>
      <text x="12" y="38" fill="#6ee7b7" font-size="10">LOW / MEDIUM / HIGH / CRITICAL</text>
    </g>
    <text x="895" y="47" fill="#6366f1" font-size="18" font-weight="900">→</text>
    <g transform="translate(920, 15)">
      <rect x="0" y="0" width="180" height="55" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
      <text x="10" y="22" fill="#e0e7ff" font-size="11" font-weight="700">AI Advisory Layer</text>
      <text x="10" y="38" fill="#a5b4fc" font-size="10">Grounding &amp; Citations</text>
    </g>
  </g>

  <!-- Connect 6 to 7 -->
  <line x1="600" y1="685" x2="600" y2="705" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- LAYER 7: GOVERNANCE & AUDIT TRAIL -->
  <g transform="translate(40, 705)">
    <rect x="0" y="0" width="1120" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#0f172a" />
    <text x="20" y="40" fill="#cbd5e1" font-size="12" font-weight="800" letter-spacing="1">7. GOVERNANCE</text>

    <g transform="translate(180, 12)">
      <rect x="0" y="0" width="290" height="45" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" />
      <text x="12" y="21" fill="#f8fafc" font-size="11" font-weight="700">Procurement Officer Determination</text>
      <text x="12" y="36" fill="#10b981" font-size="10">QUALIFY / DISQUALIFY / CLARIFY (Mandatory Justification)</text>
    </g>
    <g transform="translate(490, 12)">
      <rect x="0" y="0" width="290" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="21" fill="#f8fafc" font-size="11" font-weight="700">Evaluation Runs Ledger</text>
      <text x="12" y="36" fill="#94a3b8" font-size="10">Versioned evaluation runs &amp; score snapshots</text>
    </g>
    <g transform="translate(800, 12)">
      <rect x="0" y="0" width="300" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="21" fill="#f8fafc" font-size="11" font-weight="700">Append-Only Audit Trail</text>
      <text x="12" y="36" fill="#94a3b8" font-size="10">Actor ID, timestamp, action type, before/after diff</text>
    </g>
  </g>

  <!-- Connect 7 to 8 -->
  <line x1="600" y1="775" x2="600" y2="795" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- LAYER 8: DATA PERSISTENCE LAYER -->
  <g transform="translate(40, 795)">
    <rect x="0" y="0" width="1120" height="65" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="160" height="65" rx="10" fill="#0f172a" />
    <text x="25" y="38" fill="#e2e8f0" font-size="12" font-weight="800" letter-spacing="1">8. PERSISTENCE</text>

    <g transform="translate(180, 11)">
      <rect x="0" y="0" width="440" height="42" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="16" y="26" fill="#f1f5f9" font-size="11" font-weight="700">Local Active Database: SQLite (sql.js / WASM)</text>
      <text x="310" y="26" fill="#94a3b8" font-size="10">data/gev_verify.sqlite</text>
    </g>
    <g transform="translate(640, 11)">
      <rect x="0" y="0" width="460" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="16" y="26" fill="#f1f5f9" font-size="11" font-weight="700">Production Infrastructure Option: PostgreSQL + Prisma</text>
      <text x="365" y="26" fill="#94a3b8" font-size="10">Docker / Compose</text>
    </g>
  </g>
</svg>
